version: 2

# Security updates for npm and cargo arrive through Dependabot security alerts
# and need no configuration here. What does need configuring is the actions
# ecosystem: the workflows pin third-party actions to commit SHAs so a
# compromised upstream cannot execute with the repo token, and the cost of
# pinning is that those pins go stale. Dependabot moves them, with the version
# comment kept in step.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
