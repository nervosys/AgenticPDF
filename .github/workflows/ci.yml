name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

# Least privilege: these jobs only read the tree and upload coverage. Without
# this block the token takes the repository default, which can include write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    # Gates on what a consumer of the package actually installs. The existing
    # security workflows run `npm audit || echo`, which reports but never
    # fails; this one fails, and production is currently at zero, so it stays
    # green until something regresses. Dev-only findings are excluded
    # deliberately -- build tooling is not reachable by a consumer, and
    # blocking every PR on an unpatched eslint transitive would train everyone
    # to ignore the gate.
    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=high

    # The website is a second npm project with its own lockfile, and the gate
    # above cannot see it. That gap was real: while the root reported
    # production-clean, `website/` was carrying four HIGH advisories -- Next.js
    # SSRF, a PostCSS path traversal, an unbounded nanoid loop and four
    # inherited libvips CVEs in sharp. GitHub's Dependabot found them; this
    # repository's own CI did not, because nothing here had ever run `npm
    # audit` inside that directory.
    #
    # It gates at `high` and it is allowed to fail. The site is a static export
    # and these are build-time exposures rather than visitor-facing ones, but a
    # build-time exposure is still how a signed artefact gets poisoned.
    - name: Audit website dependencies
      if: matrix.node-version == '20.x'
      working-directory: website
      run: |
        npm ci
        npm audit --audit-level=high

    - name: Run linting
      run: npm run lint
      
    - name: Run type checking
      run: npm run typecheck
      
    - name: Run tests
      run: npm run test:coverage
      
    - name: Upload coverage to Codecov
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false
        
  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build package
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          dist/
          AgenticPDF.ts
        retention-days: 7
