name: Dependency Update Security Check

on:
  schedule:
    # Check for dependency updates weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  dependency-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Check for outdated dependencies
      run: |
        echo "Checking for outdated dependencies..."
        npm outdated || echo "Outdated check complete"
        
    - name: Run security audit
      run: |
        echo "Running security audit on current dependencies..."
        npm audit --audit-level moderate || echo "Audit complete"
        
    - name: Check for security updates
      run: |
        echo "Checking for security updates..."
        npm audit fix --dry-run || echo "Security update check complete"
        
    - name: Generate dependency report
      run: |
        echo "Generating dependency security report..."
        npm list --depth=0 > dependency-report.txt
        echo "Current dependencies saved to dependency-report.txt"
        
    - name: Upload dependency report
      uses: actions/upload-artifact@v7
      with:
        name: dependency-security-report
        path: dependency-report.txt
        retention-days: 30
