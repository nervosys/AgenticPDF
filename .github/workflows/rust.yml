name: Rust CLI

on:
  push:
    branches: [master, main]
    paths:
      - "agenticpdf-rs/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "agenticpdf-rs/**"
      - ".github/workflows/rust.yml"

# Least privilege: build and test only read the tree. Without this block the
# token takes the repository default, which can include write.
permissions:
  contents: read

defaults:
  run:
    working-directory: agenticpdf-rs

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agenticpdf-rs

      - name: Formatting
        run: cargo fmt --check

      # Dependency CVEs. The two ignores are quick-xml advisories reached only
      # through accesskit_unix -- Linux desktop accessibility for the reader
      # GUI, absent from the library and from every other target. They are
      # upstream's to move; ignoring them by id keeps this gate meaningful for
      # everything else rather than permanently red.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # The two ignores are a triage decision, not a silencing. Recorded here
      # because an unexplained `--ignore` is indistinguishable from one, and
      # the next person to read this file deserves to know which it is.
      #
      # RUSTSEC-2026-0194 and -0195 are both quick-xml 0.30.0, both 7.5 HIGH,
      # both denial-of-service. They arrive as:
      #
      #   quick-xml <- zbus_xml <- zbus-lockstep <- atspi-common <- atspi
      #             <- accesskit_unix <- accesskit_winit <- egui-winit
      #             <- eframe <- apdf-reader
      #
      # accesskit_unix is the Linux AT-SPI accessibility backend. It parses
      # D-Bus introspection XML, never a document: this crate's own XML is a
      # hand-written parser in src/xml.rs with no quick-xml dependency, so
      # untrusted input cannot reach the vulnerable code. It is also absent
      # from every shipped artefact but the Linux desktop build -- not in the
      # wasm bundle, the Android or iOS libraries, or the CLI elsewhere.
      #
      # It cannot be fixed from this repository: the version is pinned
      # transitively through eframe, and `cargo update` does not move it.
      # Remove these ignores when an accesskit/eframe release carries
      # quick-xml >= 0.41. See SECURITY_AUDIT.md section 1.3a.
      - name: Dependency audit
        run: >
          cargo audit
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (ocr feature)
        run: cargo clippy --features ocr --all-targets -- -D warnings

      - name: Test (default features)
        run: cargo test

      - name: Test (ocr feature)
        run: cargo test --features ocr

      - name: Build release binary
        run: cargo build --release

      - name: Check WASM target
        run: cargo check --target wasm32-unknown-unknown --features wasm --no-default-features
