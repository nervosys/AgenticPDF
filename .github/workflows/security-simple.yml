name: Security Scan (Simplified)

on:
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Allow manual triggering

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run npm audit
      run: |
        echo "Running npm audit..."
        npm audit --audit-level moderate || echo "npm audit found vulnerabilities"
        
    - name: Run npm audit fix (dry run)
      run: |
        echo "Checking if vulnerabilities can be automatically fixed..."
        npm audit fix --dry-run || true
      
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: typescript
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
        
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:typescript"
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        
    - name: Upload Trivy scan results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      # `always()` alone uploads even when the scan never ran -- an earlier
      # step failing (a GitHub outage during CodeQL init, say) skips Trivy and
      # then this fails on a missing file, turning one transient error into
      # two. Upload only when there is something to upload.
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: 'trivy-results.sarif'
        
    - name: Run ESLint Security Scanner
      run: |
        echo "Running ESLint security scan..."
        npm run lint || echo "ESLint found issues"
        
    - name: Check for sensitive files
      run: |
        echo "Checking for sensitive files..."
        find . -name "*.pem" -o -name "*.key" -o -name "*.p12" -o -name "*.pfx" -o -name "id_rsa*" -o -name "id_dsa*" -o -name "id_ecdsa*" -o -name "id_ed25519*" | grep -v node_modules | grep -v .git || echo "No sensitive files found"
        
    - name: Run basic secret detection
      run: |
        echo "Scanning for common secret patterns..."
        # Basic regex patterns for common secrets
        grep -r -i -E "(password|passwd|pwd|secret|token|key|api_key|apikey)" --include="*.ts" --include="*.js" --include="*.json" . | grep -v node_modules | grep -v .git || echo "No obvious secrets found"
        
    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      if: github.event_name == 'pull_request'

  license-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Check licenses
      run: |
        echo "Checking for license compatibility..."
        npx license-checker --summary --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Unlicense;CC0-1.0' || echo "License check completed"
