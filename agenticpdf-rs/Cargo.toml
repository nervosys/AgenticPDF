[package]
name = "agenticpdf"
version = "1.0.0"
edition = "2024"
authors = ["NERVOSYS, LLC"]
license = "AGPL-3.0-or-later"
description = "High-performance PDF processing CLI and WASM library for agentic AI workflows"
repository = "https://github.com/nervosys/AgenticPDF"
keywords = ["pdf", "ai", "wasm", "cli", "agentic"]
categories = ["command-line-utilities", "wasm", "parser-implementations"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "apdf"
path = "src/main.rs"

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["cli"]
cli = []
wasm = ["wasm-bindgen"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
