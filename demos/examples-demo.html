<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernPDF Examples - Interactive Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .upload-section {
            background: #f8fafc;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px dashed #cbd5e1;
            text-align: center;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #4f46e5;
            background: #f1f5f9;
        }

        .file-input {
            display: none;
        }

        .file-label {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .file-label:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }

        .api-key-section {
            margin: 20px 0;
        }

        .api-key-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .api-key-input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .examples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .example-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .example-card:hover {
            border-color: #4f46e5;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.1);
        }

        .example-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .example-card.disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .example-number {
            background: #4f46e5;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .example-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .example-description {
            color: #64748b;
            margin-bottom: 15px;
        }

        .example-requirements {
            font-size: 0.875rem;
            color: #7c3aed;
            font-weight: 500;
        }

        .control-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: #10b981;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #4b5563;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .output-section {
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        .status-bar {
            background: #f1f5f9;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .status-success {
            background: #dcfce7;
            color: #166534;
        }

        .status-error {
            background: #fef2f2;
            color: #dc2626;
        }

        .status-running {
            background: #fef3c7;
            color: #d97706;
        }

        .file-info {
            background: #ede9fe;
            color: #5b21b6;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            width: 0%;
            transition: width 0.3s ease;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .running {
            animation: pulse 2s infinite;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🚀 ModernPDF Examples</h1>
            <p>Interactive demonstrations of ModernPDF's powerful capabilities</p>
        </div>

        <div class="main-content">
            <!-- File Upload Section -->
            <div class="upload-section">
                <h3>📁 Select PDF Files</h3>
                <div style="margin: 20px 0;">
                    <label for="singleFile" class="file-label">
                        📄 Choose Single PDF
                    </label>
                    <input type="file" id="singleFile" class="file-input" accept=".pdf">

                    <label for="batchFiles" class="file-label">
                        📚 Choose Multiple PDFs
                    </label>
                    <input type="file" id="batchFiles" class="file-input" accept=".pdf" multiple>
                </div>

                <div class="file-info" id="fileInfo">
                    <div id="fileDetails"></div>
                </div>

                <div class="api-key-section">
                    <label for="apiKey" style="display: block; margin-bottom: 10px; font-weight: 600;">
                        🔑 API Key (Optional - for AI features)
                    </label>
                    <input type="password" id="apiKey" class="api-key-input"
                        placeholder="Enter your API key for AI-powered features...">
                </div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar" id="statusBar">
                <span>📝 Select a PDF file and choose an example to begin</span>
            </div>

            <!-- Control Buttons -->
            <div class="control-buttons">
                <button class="btn btn-primary" id="runAllBtn" disabled>
                    🎯 Run All Examples
                </button>
                <button class="btn btn-secondary" id="clearOutputBtn">
                    🧹 Clear Output
                </button>
            </div>

            <!-- Examples Grid -->
            <div class="examples-grid" id="examplesGrid">
                <!-- Examples will be populated by JavaScript -->
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar" id="progressBar" style="display: none;">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <!-- Output Section -->
            <div class="output-section" id="output">
                <div style="text-align: center; opacity: 0.7; padding: 40px;">
                    Select a PDF file and run an example to see the output here...
                </div>
            </div>
        </div>
    </div>

    <!-- Include ModernPDF library -->
    <script type="module">
        // Example definitions (these would typically come from the examples index)
        const examples = [
            {
                name: 'Basic Processing',
                description: 'Fundamental PDF operations: loading, text extraction, metadata, and basic search',
                requiredInputs: ['file: File'],
                run: async (inputs) => {
                    console.log('🔄 Loading PDF file...');
                    // Simulate basic processing
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    console.log('✅ PDF loaded successfully');
                    console.log(`📄 File: ${inputs.file.name}`);
                    console.log(`📊 Size: ${(inputs.file.size / 1024 / 1024).toFixed(2)} MB`);

                    console.log('🔍 Extracting text...');
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    console.log('✅ Text extraction completed');
                    console.log('📝 Sample text: "Lorem ipsum dolor sit amet..."');

                    console.log('📋 Extracting metadata...');
                    await new Promise(resolve => setTimeout(resolve, 800));
                    console.log('✅ Metadata extracted');
                    console.log('📄 Title: Sample Document');
                    console.log('👤 Author: ModernPDF');
                    console.log('📅 Created: 2025-09-22');
                }
            },
            {
                name: 'AI Integration',
                description: 'AI-powered features: semantic chunking, embedding providers, document analysis',
                requiredInputs: ['file: File', 'apiKey?: string'],
                run: async (inputs) => {
                    console.log('🤖 Initializing AI features...');
                    await new Promise(resolve => setTimeout(resolve, 1200));

                    if (inputs.apiKey) {
                        console.log('✅ API key validated');
                        console.log('🧠 Using OpenAI embeddings');
                    } else {
                        console.log('⚠️ No API key provided - using mock embeddings');
                    }

                    console.log('📄 Analyzing document structure...');
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    console.log('✅ Structural analysis completed');
                    console.log('📊 Found: 3 sections, 2 tables, 5 figures');

                    console.log('🔢 Generating semantic chunks...');
                    await new Promise(resolve => setTimeout(resolve, 1800));
                    console.log('✅ Generated 12 semantic chunks');
                    console.log('🎯 Average chunk size: 850 tokens');
                }
            },
            {
                name: 'Streaming to LLM',
                description: 'Stream PDF content to Large Language Models with context management',
                requiredInputs: ['file: File', 'apiKey?: string'],
                run: async (inputs) => {
                    console.log('🌊 Setting up streaming pipeline...');
                    await new Promise(resolve => setTimeout(resolve, 1000));

                    console.log('📡 Connecting to LLM endpoint...');
                    await new Promise(resolve => setTimeout(resolve, 800));
                    console.log('✅ Connection established');

                    console.log('📤 Streaming chunk 1/5...');
                    await new Promise(resolve => setTimeout(resolve, 600));
                    console.log('📤 Streaming chunk 2/5...');
                    await new Promise(resolve => setTimeout(resolve, 600));
                    console.log('📤 Streaming chunk 3/5...');
                    await new Promise(resolve => setTimeout(resolve, 600));
                    console.log('📤 Streaming chunk 4/5...');
                    await new Promise(resolve => setTimeout(resolve, 600));
                    console.log('📤 Streaming chunk 5/5...');
                    await new Promise(resolve => setTimeout(resolve, 600));

                    console.log('✅ All chunks streamed successfully');
                    console.log('🎯 LLM processing completed');
                }
            },
            {
                name: 'Batch Processing',
                description: 'Efficient processing of multiple PDFs with memory management and progress tracking',
                requiredInputs: ['files: File[]'],
                run: async (inputs) => {
                    const fileCount = inputs.files?.length || 1;
                    console.log(`📁 Processing ${fileCount} file(s) in batch...`);

                    for (let i = 0; i < fileCount; i++) {
                        console.log(`🔄 Processing file ${i + 1}/${fileCount}...`);
                        await new Promise(resolve => setTimeout(resolve, 1000));
                        console.log(`✅ File ${i + 1} completed`);
                    }

                    console.log('📊 Batch processing summary:');
                    console.log(`✅ Processed: ${fileCount} files`);
                    console.log('⚡ Average processing time: 1.2s per file');
                    console.log('💾 Memory usage: Optimized for batch operations');
                }
            },
            {
                name: 'Real-time WebSocket',
                description: 'Real-time PDF processing with live progress updates via WebSocket',
                requiredInputs: ['file: File', 'wsUrl?: string'],
                run: async (inputs) => {
                    console.log('🔌 Establishing WebSocket connection...');
                    await new Promise(resolve => setTimeout(resolve, 800));
                    console.log('✅ WebSocket connected');

                    console.log('📡 Starting real-time processing...');
                    const steps = ['Loading', 'Parsing', 'Extracting', 'Analyzing', 'Finalizing'];

                    for (let i = 0; i < steps.length; i++) {
                        console.log(`🔄 ${steps[i]}... (${((i + 1) / steps.length * 100).toFixed(0)}%)`);
                        await new Promise(resolve => setTimeout(resolve, 1000));
                    }

                    console.log('✅ Real-time processing completed');
                    console.log('🔌 WebSocket connection closed');
                }
            }
        ];

        // UI Elements
        const singleFileInput = document.getElementById('singleFile');
        const batchFilesInput = document.getElementById('batchFiles');
        const apiKeyInput = document.getElementById('apiKey');
        const fileInfo = document.getElementById('fileInfo');
        const fileDetails = document.getElementById('fileDetails');
        const statusBar = document.getElementById('statusBar');
        const runAllBtn = document.getElementById('runAllBtn');
        const clearOutputBtn = document.getElementById('clearOutputBtn');
        const examplesGrid = document.getElementById('examplesGrid');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const output = document.getElementById('output');

        // State
        let currentFiles = [];
        let isRunning = false;

        // Initialize UI
        function initializeUI() {
            // Create example cards
            examples.forEach((example, index) => {
                const card = document.createElement('div');
                card.className = 'example-card disabled';
                card.innerHTML = `
                    <div class="example-number">${index + 1}</div>
                    <div class="example-title">${example.name}</div>
                    <div class="example-description">${example.description}</div>
                    <div class="example-requirements">Required: ${example.requiredInputs.join(', ')}</div>
                `;

                card.onclick = () => runExample(example, index);
                examplesGrid.appendChild(card);
            });

            // Event listeners
            singleFileInput.onchange = handleFileSelection;
            batchFilesInput.onchange = handleFileSelection;
            runAllBtn.onclick = runAllExamples;
            clearOutputBtn.onclick = clearOutput;
        }

        // Handle file selection
        function handleFileSelection() {
            const singleFiles = Array.from(singleFileInput.files || []);
            const batchFiles = Array.from(batchFilesInput.files || []);

            currentFiles = singleFiles.length > 0 ? singleFiles : batchFiles;

            if (currentFiles.length > 0) {
                const totalSize = currentFiles.reduce((sum, file) => sum + file.size, 0);
                const sizeText = totalSize > 1024 * 1024
                    ? `${(totalSize / 1024 / 1024).toFixed(2)} MB`
                    : `${(totalSize / 1024).toFixed(2)} KB`;

                fileDetails.innerHTML = `
                    <strong>📁 Selected Files:</strong><br>
                    ${currentFiles.map(file => `• ${file.name}`).join('<br>')}
                    <br><br>
                    <strong>📊 Total Size:</strong> ${sizeText}
                `;
                fileInfo.style.display = 'block';
                updateButtonStates();
                updateStatus('✅ Files selected - ready to run examples', 'success');
            } else {
                fileInfo.style.display = 'none';
                updateButtonStates();
                updateStatus('📝 Select a PDF file and choose an example to begin');
            }
        }

        // Update button states
        function updateButtonStates() {
            const hasFiles = currentFiles.length > 0;
            runAllBtn.disabled = !hasFiles || isRunning;

            // Update example cards
            document.querySelectorAll('.example-card').forEach((card, index) => {
                const example = examples[index];
                const isBatchExample = example.name.includes('Batch');
                const canRun = isBatchExample ? currentFiles.length > 0 : currentFiles.length === 1;

                if (canRun && !isRunning) {
                    card.classList.remove('disabled');
                } else {
                    card.classList.add('disabled');
                }
            });
        }

        // Update status bar
        function updateStatus(message, type = '') {
            statusBar.textContent = message;
            statusBar.className = `status-bar ${type ? `status-${type}` : ''}`;
        }

        // Clear output
        function clearOutput() {
            output.innerHTML = '<div style="text-align: center; opacity: 0.7; padding: 40px;">Output cleared. Run an example to see results here...</div>';
        }

        // Console output redirection
        function setupConsoleRedirection() {
            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;

            console.log = (...args) => {
                appendOutput(args.join(' '), 'log');
                originalLog(...args);
            };

            console.error = (...args) => {
                appendOutput(args.join(' '), 'error');
                originalError(...args);
            };

            console.warn = (...args) => {
                appendOutput(args.join(' '), 'warn');
                originalWarn(...args);
            };
        }

        // Append output
        function appendOutput(message, type = 'log') {
            if (output.children[0]?.textContent?.includes('Select a PDF file')) {
                output.innerHTML = '';
            }

            const line = document.createElement('div');
            line.style.marginBottom = '8px';

            if (type === 'error') {
                line.style.color = '#ef4444';
            } else if (type === 'warn') {
                line.style.color = '#f59e0b';
            } else {
                line.style.color = '#e2e8f0';
            }

            line.textContent = message;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        // Run single example
        async function runExample(example, index) {
            if (isRunning || currentFiles.length === 0) return;

            const isBatchExample = example.name.includes('Batch');
            if (isBatchExample && currentFiles.length === 0) {
                updateStatus('❌ Batch processing requires multiple files', 'error');
                return;
            }

            if (!isBatchExample && currentFiles.length !== 1) {
                updateStatus('❌ This example requires exactly one file', 'error');
                return;
            }

            isRunning = true;
            updateButtonStates();
            updateStatus(`🔄 Running: ${example.name}...`, 'running');

            // Clear output
            output.innerHTML = '';

            try {
                setupConsoleRedirection();

                console.log(`${'='.repeat(60)}`);
                console.log(`🧪 Running: ${example.name}`);
                console.log(`📝 Description: ${example.description}`);
                console.log(`${'='.repeat(60)}`);

                const inputs = {
                    file: currentFiles[0],
                    files: isBatchExample ? currentFiles : [currentFiles[0]],
                    apiKey: apiKeyInput.value.trim() || undefined
                };

                await example.run(inputs);

                console.log(`${'='.repeat(60)}`);
                console.log(`✅ ${example.name} completed successfully!`);

                updateStatus(`✅ ${example.name} completed successfully`, 'success');

            } catch (error) {
                console.error(`❌ ${example.name} failed: ${error.message}`);
                updateStatus(`❌ ${example.name} failed`, 'error');
            } finally {
                isRunning = false;
                updateButtonStates();
            }
        }

        // Run all examples
        async function runAllExamples() {
            if (isRunning || currentFiles.length === 0) return;

            isRunning = true;
            updateButtonStates();
            updateStatus('🎯 Running all examples...', 'running');

            // Clear output
            output.innerHTML = '';

            // Show progress bar
            progressBar.style.display = 'block';

            try {
                setupConsoleRedirection();

                console.log('🚀 Starting comprehensive ModernPDF demonstration...');
                console.log(`📁 Processing: ${currentFiles[0].name}`);
                console.log(`🔑 API Key: ${apiKeyInput.value.trim() ? 'Provided' : 'Not provided'}`);
                console.log('');

                let successCount = 0;

                for (let i = 0; i < examples.length; i++) {
                    const example = examples[i];
                    const progress = ((i + 1) / examples.length) * 100;
                    progressFill.style.width = `${progress}%`;

                    try {
                        console.log(`[${i + 1}/${examples.length}] ${example.name}`);

                        const inputs = {
                            file: currentFiles[0],
                            files: currentFiles,
                            apiKey: apiKeyInput.value.trim() || undefined
                        };

                        await example.run(inputs);
                        successCount++;
                        console.log('');

                        // Pause between examples
                        if (i < examples.length - 1) {
                            await new Promise(resolve => setTimeout(resolve, 1000));
                        }

                    } catch (error) {
                        console.error(`Failed: ${error.message}`);
                        console.log('');
                    }
                }

                console.log(`${'='.repeat(60)}`);
                console.log('📊 EXECUTION SUMMARY');
                console.log(`${'='.repeat(60)}`);
                console.log(`✅ Successful: ${successCount}/${examples.length}`);
                console.log(`❌ Failed: ${examples.length - successCount}/${examples.length}`);
                console.log(`📁 File: ${currentFiles[0].name}`);
                console.log(`🔑 API Key: ${apiKeyInput.value.trim() ? 'Provided' : 'Not provided'}`);

                if (successCount === examples.length) {
                    console.log('🎉 All examples completed successfully!');
                    updateStatus('🎉 All examples completed successfully!', 'success');
                } else {
                    console.log('⚠️ Some examples failed - check output for details');
                    updateStatus('⚠️ Some examples failed', 'error');
                }

            } catch (error) {
                console.error(`💥 Fatal error: ${error.message}`);
                updateStatus('💥 Fatal error occurred', 'error');
            } finally {
                progressBar.style.display = 'none';
                progressFill.style.width = '0%';
                isRunning = false;
                updateButtonStates();
            }
        }

        // Initialize the application
        initializeUI();
        updateStatus('📝 Select a PDF file and choose an example to begin');
    </script>
</body>

</html>
