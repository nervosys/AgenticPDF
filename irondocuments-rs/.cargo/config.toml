# Android cross-compilation.
#
# Cargo needs to be told which linker to use per target; the NDK ships a clang
# wrapper per ABI and API level that already knows the sysroot, so pointing at
# it is the whole configuration. 21 is the minimum API these wrappers provide
# and covers effectively every device still in use.
#
# Set ANDROID_NDK_HOME and these paths resolve; without it, the desktop build is
# unaffected because these sections only apply to Android targets.

[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang.cmd"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang.cmd"

[target.x86_64-linux-android]
linker = "x86_64-linux-android21-clang.cmd"
