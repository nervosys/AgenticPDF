[package]
name = "irondocuments"
version = "1.0.0"
edition = "2024"
authors = ["NERVOSYS, LLC"]
license = "AGPL-3.0-or-later"
description = "High-performance PDF processing CLI and WASM library for agentic AI workflows"
repository = "https://github.com/nervosys/IronDocuments"
keywords = ["pdf", "ai", "wasm", "cli", "agentic"]
categories = ["command-line-utilities", "wasm", "parser-implementations"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "irondoc"
path = "src/main.rs"

[[bin]]
name = "idoc"
path = "src/idoc.rs"

[dependencies]
# The company ontology vocabulary, vendored under `vendor/`. NS-ONTO-001 §7.1
# has the obligations travel with the copy, so re-vendoring delivers new ones as
# failing tests. A path dependency on a sibling checkout was tried and removed:
# CI checks out this repository alone, so it built here and nowhere else.
nervosys-ontology = { path = "vendor/nervosys-ontology" }
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
# Legacy Office (.doc/.xls/.ppt) live in OLE2 compound files and predate
# Unicode, so they need a container reader and the Windows code pages.
cfb = "0.14"
encoding_rs = "0.8"
# Optional: only pulled in by the `ocr` feature, for decoding embedded scanned
# images (JPEG/PNG) into pixels for an OCR backend. Keeps the default lean.
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
# Optional: pure-Rust CCITT Group 3/4 (fax) decoder for scanned bilevel images.
fax = { version = "0.2.7", optional = true }
# Optional: lightweight blocking HTTP client (no TLS) for the HTTP OCR backend
# that calls a PaddleOCR / EasyOCR / liteparse-compatible /ocr server.
ureq = { version = "2", optional = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["cli"]
cli = []
wasm = ["wasm-bindgen"]
# Enables the image-decode pipeline (via the `image` crate) so scanned-page
# images become grayscale pixels for an `ImageOcrBackend`. Scanned-page
# detection and the page-level OcrBackend interface are always available; this
# flag adds the pixel pipeline and flips the OCR_BUILTIN marker. The recognizer
# engine itself (Tesseract FFI / ONNX) is wired by implementing the backend.
ocr = ["dep:image", "dep:fax", "dep:ureq"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[workspace]
members = ["apps/reader"]
# Vendored, not ours: excluded so `--workspace` does not lint or test a copy
# whose obligations this project is meant to be held to, not to maintain.
exclude = ["vendor/nervosys-ontology"]
